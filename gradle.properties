# The build host (optiplex, 7 GiB shared with the homelab) must survive a build: one JVM (Kotlin compiles in-process
# instead of in a second daemon), two workers, and all of it under the container cap in scripts/build.sh.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
